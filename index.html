<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Benjamin Le's Portfolio</title>
  <style>
    :root {
      --bg: #050505;
      --fg-dim: #3a3a3a;
      --fg-mid: #8a8a8a;
      --fg-bright: #f2f2f2;
      --accent: #ffffff;
      --accent-dim: #5a5a5a;
      --panel-bg: rgba(8, 8, 8, 0.88);
      --panel-border: rgba(255, 255, 255, 0.14);
      --font-body: 'IBM Plex Mono', 'Courier New', monospace;
    }

    * {
      box-sizing: border-box;
      cursor: none !important;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    #ascii-field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      cursor: none;
    }

    #cursor-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 340px;
      height: 340px;
      margin-left: -170px;
      margin-top: -170px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle,
          rgba(255, 255, 255, 0.12) 0%,
          rgba(255, 255, 255, 0.06) 28%,
          rgba(255, 255, 255, 0.0) 70%);
      transition: opacity 0.25s ease;
      opacity: 0;
      will-change: transform;
    }

    #bracket-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 70px;
      height: 30px;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transform: translate(-50%, -50%);
    }

    #bracket-cursor .left,
    #bracket-cursor .right {
      position: absolute;
      font-family: var(--font-body);
      font-size: 28px;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1;
    }

    #bracket-cursor .left {
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      border-right: none;
    }

    #bracket-cursor .right {
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      border-left: none;
    }

    .app {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: row;
      pointer-events: none;
    }

    .sidebar {
      pointer-events: none;
      position: relative;
      width: clamp(200px, 18vw, 260px);
      flex-shrink: 0;
      height: 100%;
      padding: clamp(18px, 3vw, 36px) 0 clamp(20px, 3vw, 34px) clamp(20px, 3vw, 40px);
    }

    .brand {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand .mark {
      font-size: clamp(15px, 1.8vw, 19px);
      letter-spacing: 0.04em;
      color: var(--fg-bright);
      font-weight: 600;
    }

    .brand .mark .blink {
      display: inline-block;
      width: 0.55ch;
      color: var(--accent);
      animation: blink 1.1s steps(1) infinite;
    }

    .brand .tagline {
      font-size: clamp(10px, 1vw, 12px);
      color: var(--fg-mid);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .status {
      pointer-events: none;
      position: fixed;
      top: clamp(18px, 3vw, 36px);
      right: clamp(20px, 4vw, 48px);
      z-index: 3;
      font-size: clamp(10px, 1vw, 12px);
      color: var(--fg-mid);
      text-align: right;
      letter-spacing: 0.06em;
      line-height: 1.6;
    }

    .status .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--fg-bright);
      margin-right: 6px;
      box-shadow: 0 0 6px var(--fg-bright);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    main.stage {
      pointer-events: none;
      flex: 1;
      position: relative;
    }

    nav.dock {
      pointer-events: auto;
      position: absolute;
      top: 50%;
      left: clamp(20px, 3vw, 40px);
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
      width: calc(100% - clamp(20px, 3vw, 40px));
    }

    .dock-btn {
      appearance: none;
      border: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.075);
      color: var(--fg-mid);
      font-family: var(--font-body);
      font-size: clamp(15px, 1.8vw, 19px);
      letter-spacing: 0.05em;
      padding: 18px 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease, transform 0.12s ease;
    }

    .dock-btn .num {
      color: var(--fg-dim);
      font-size: 0.85em;
    }

    .dock-btn:hover {
      border-color: rgba(255, 255, 255, 0.45);
      color: var(--fg-bright);
      background: rgba(255, 255, 255, 0.07);
      transform: translateX(3px);
    }

    .dock-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .dock-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(255, 255, 255, 0.10);
    }

    .dock-btn.active .num {
      color: var(--accent-dim);
    }

    /* overlay panel */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: rgba(2, 4, 5, .55);
      opacity: 0;
      visibility: hidden;
      transition: opacity .22s ease;
    }

    #overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .panel {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) scale(0.985);
      opacity: 0;
      pointer-events: auto;
      width: calc(100% - 40px - 450px);
      max-width: 760px;
      max-height: min(1050px, calc(100vh - 104px));
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      transition: transform 0.22s ease, opacity 0.22s ease;
      overflow: hidden;
      margin-left: 225px;
    }

    #overlay.open .panel {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }

    .panel.is-dragging {
      transition: opacity 0.22s ease;
      transform: none !important;
    }

    /* panel-head: visible for stack/projects, hidden for about */
    .panel-head {
      cursor: move;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      border-bottom: 1px solid var(--panel-border);
      flex-shrink: 0;
    }

    .panel-head.hidden {
      display: none;
    }

    .panel-head .title {
      color: var(--fg-bright);
      font-size: 14px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel-head .title .idx {
      color: var(--accent);
    }

    .panel-close {
      appearance: none;
      background: none;
      border: 1px solid var(--panel-border);
      color: var(--fg-mid);
      width: 28px;
      height: 28px;
      border-radius: 3px;
      font-size: 14px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .panel-close:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .panel-body {
      padding: 22px;
      overflow-y: auto;
      color: var(--fg-mid);
      font-size: 13.5px;
      line-height: 1.65;
    }

    .panel-body.no-pad {
      padding: 0;
    }

    .panel-body::-webkit-scrollbar { width: 8px; }
    .panel-body::-webkit-scrollbar-track { background: transparent; }
    .panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    .panel-body h3 {
      color: var(--fg-bright);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 0 0 10px;
    }

    .panel-body p { margin: 0 0 14px; }
    .panel-body .muted { color: var(--fg-dim); }

    .stack-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 4px;
    }

    .stack-item {
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.02);
    }

    .stack-item .label {
      color: var(--fg-bright);
      font-size: 12.5px;
      display: block;
      margin-bottom: 3px;
    }

    .stack-item .meta {
      color: var(--fg-dim);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .proj {
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 14px 16px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.02);
    }

    .proj:last-child { margin-bottom: 0; }

    .proj .proj-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .proj .proj-name { color: var(--fg-bright); font-size: 14px; }
    .proj .proj-tags { color: var(--accent); font-size: 11px; letter-spacing: 0.04em; }
    .proj .proj-desc { margin-top: 6px; color: var(--fg-mid); font-size: 13px; }

    .proj a.proj-link {
      color: var(--fg-mid);
      font-size: 11.5px;
      text-decoration: none;
      border-bottom: 1px solid var(--fg-dim);
      display: inline-block;
      margin-top: 8px;
    }

    .proj a.proj-link:hover { color: var(--accent); border-color: var(--accent); }

    .social-row {
      pointer-events: auto;
      position: absolute;
      left: clamp(20px, 3vw, 40px);
      bottom: clamp(20px, 3vw, 36px);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .social-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      color: var(--fg-mid);
      transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease, transform 0.12s ease;
    }

    .social-icon:hover {
      color: var(--fg-bright);
      border-color: rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.07);
      transform: translateY(-2px);
    }

    .social-icon:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    @keyframes termOpen {
      from { transform: scale(0.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 640px) {
      .app { flex-direction: column; }
      .sidebar { width: 100%; height: auto; padding: 16px clamp(16px, 4vw, 28px) 14px; }
      .dock { position: relative; top: auto; left: auto; transform: none; margin-top: 18px; flex-direction: row; flex-wrap: wrap; gap: 8px; width: 100%; }
      .dock-btn { width: auto; padding: 10px 14px; font-size: 13px; }
      .social-row { position: relative; left: auto; bottom: auto; margin-top: 18px; }
      #cursor-glow { display: none; }
      .panel { width: calc(100% - 20px); margin-left: 0; left: 10px; transform: none !important; }
    }

    @media (prefers-reduced-motion: reduce) {
      .brand .mark .blink { animation: none; opacity: 1; }
      .status .dot { animation: none; }
    }

    #bracket-cursor.hover {
      transform: scale(1.38) translate(-50%, -50%);
      transition: transform 0.12s ease, opacity 0.2s ease;
    }

    #bracket-cursor.hover .left,
    #bracket-cursor.hover .right {
      color: rgba(255, 255, 255, 0.85);
    }

    /* move-icon: hidden unless hovering a drag handle */
    #bracket-cursor .move-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      transition: opacity 0.12s ease, transform 0.12s ease;
      pointer-events: none;
    }

    #bracket-cursor.drag-mode .left,
    #bracket-cursor.drag-mode .right {
      opacity: 0;
    }

    #bracket-cursor.drag-mode .move-icon {
      opacity: 0.6;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>

  <script>
    (function () {
      const canvas = document.getElementById('ascii-field');
      const ctx = canvas.getContext('2d');
      const bracket = document.getElementById('bracket-cursor');

      const CHARSET_IDLE = "01.:-_+=*#%$<>/\\|{}[]()01";
      const CHARSET_AGITATED = "@#%&$*ZXKY01!?<>/\\^~";

      let cols, rows, cellW, cellH;
      let cells = [];
      let mouse = { x: -9999, y: -9999, active: false, vx: 0, vy: 0, lastX: -9999, lastY: -9999 };
      let ripples = [];
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      const FONT_SIZE = 17;
      const RADIUS = 170;
      const RADIUS2 = RADIUS * RADIUS;

      function rngChar(set) { return set[(Math.random() * set.length) | 0]; }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = window.innerWidth, h = window.innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cellW = FONT_SIZE * 0.62; cellH = FONT_SIZE * 1.05;
        cols = Math.ceil(w / cellW) + 1; rows = Math.ceil(h / cellH) + 1;
        cells = new Array(cols * rows);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const i = r * cols + c;
            if ((r + c) % 2 !== 0) { cells[i] = null; continue; }
            cells[i] = { ch: rngChar(CHARSET_IDLE), timer: Math.random() * 60, idleSpeed: 18 + Math.random() * 40, agitation: 0, baseAlpha: 0.18 + Math.random() * 0.22, phase: Math.random() * Math.PI * 2, jitterX: 0, jitterY: 0, pop: 0 };
          }
        }
      }

      function onMove(e) {
        const x = e.clientX, y = e.clientY;
        mouse.vx = x - (mouse.lastX === -9999 ? x : mouse.lastX);
        mouse.vy = y - (mouse.lastY === -9999 ? y : mouse.lastY);
        mouse.lastX = x; mouse.lastY = y;
        mouse.x = x; mouse.y = y; mouse.active = true;
        bracket.style.opacity = '1';
        bracket.style.left = `${x}px`; bracket.style.top = `${y}px`;
      }

      function onLeave() { mouse.active = false; mouse.x = -9999; mouse.y = -9999; bracket.style.opacity = '0'; }

      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', onMove, { passive: true });
      window.addEventListener('mouseleave', onLeave);
      window.addEventListener('touchmove', (e) => { if (e.touches?.[0]) onMove(e.touches[0]); }, { passive: true });
      window.addEventListener('mousedown', (e) => {
        if (ripples.length > 3) ripples.shift();
        ripples.push({ x: e.clientX, y: e.clientY, r: 0, life: 0.8 });
      });
      window.addEventListener('touchend', onLeave);

      let frame = 0;
      function tick() {
        frame++;
        ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
        ctx.font = `${FONT_SIZE}px 'IBM Plex Mono', 'Courier New', monospace`;
        ctx.textBaseline = 'top';
        const mx = mouse.x, my = mouse.y;
        const MAX_RIPPLE_RADIUS = 180;
        for (const rp of ripples) { rp.r += 1.5; rp.life *= 0.96; }
        ripples = ripples.filter(rp => rp.life > 0.02);
        const speed = Math.min(Math.hypot(mouse.vx, mouse.vy), 40);
        mouse.vx *= 0.9; mouse.vy *= 0.9;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const i = r * cols + c;
            const cell = cells[i];
            if (!cell) continue;
            const px = c * cellW, py = r * cellH;
            const cx = px + cellW / 2, cy = py + cellH / 2;
            let target = 0;
            if (mouse.active) {
              const dx = cx - mx, dy = cy - my;
              const d2 = dx * dx + dy * dy;
              if (d2 < RADIUS2) { const d = Math.sqrt(d2); const falloff = 1 - d / RADIUS; target = falloff * falloff * (0.55 + Math.min(speed / 40, 1) * 0.45); }
            }
            for (const rp of ripples) {
              if (rp.r > MAX_RIPPLE_RADIUS) continue;
              const dx = cx - rp.x, dy = cy - rp.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist > rp.r + 90) continue;
              const wave = Math.abs(dist - rp.r);
              const influence = Math.max(0, 1 - wave / 10) * rp.life;
              if (influence > 0.15) { cell.agitation += influence * 0.8; cell.pop += influence * 0.4; }
            }
            if (target > cell.agitation) { cell.agitation += (target - cell.agitation) * 0.35; }
            else { cell.agitation += (target - cell.agitation) * 0.08; }
            const ag = cell.agitation;
            if (Math.random() < 0.00003) cell.pop = 1;
            cell.pop *= 0.94;
            if (ag > 0.05) {
              if (Math.random() < 0.08 + ag * 0.5) cell.ch = rngChar(CHARSET_AGITATED);
              cell.jitterX = (Math.random() - 0.5) * ag * 4;
              cell.jitterY = (Math.random() - 0.5) * ag * 4;
            } else {
              cell.jitterX *= 0.8; cell.jitterY *= 0.8;
              cell.timer--;
              if (cell.timer <= 0) { cell.ch = rngChar(CHARSET_IDLE); cell.timer = cell.idleSpeed + Math.random() * 20; }
            }
            const breathe = 0.5 + 0.5 * Math.sin(frame * 0.02 + cell.phase);
            const flicker = (Math.random() - 0.5) * 0.07;
            let alpha = cell.baseAlpha * (0.6 + 0.4 * breathe) + ag * 0.9 + flicker + cell.pop * 0.8;
            alpha = Math.max(0.05, Math.min(1, alpha));
            let color;
            if (ag > 0.6) color = `rgba(255,255,255,${Math.min(1, alpha)})`;
            else if (ag > 0.15) color = `rgba(210,210,210,${Math.min(1, alpha)})`;
            else color = `rgba(120,120,120,${alpha})`;
            const size = FONT_SIZE * (1 + cell.pop * 0.8);
            ctx.font = `${size}px 'IBM Plex Mono', 'Courier New', monospace`;
            ctx.fillStyle = color;
            ctx.fillText(cell.ch, px + cell.jitterX - (size - FONT_SIZE) / 2, py + cell.jitterY - (size - FONT_SIZE) / 2);
          }
        }
        requestAnimationFrame(tick);
      }
      resize();
      requestAnimationFrame(tick);
    })();

    (function () {
      const content = {
        about: {
          isTerminal: true,
          html: `
            <div id="about-terminal" style="background:#0c0c0c;font-family:'IBM Plex Mono','Courier New',monospace;animation:termOpen 0.28s cubic-bezier(0.16,1,0.3,1) both;">

              </div>
            </div>
          `
        },
        stack: {
          title: 'stack',
          html: `
            <h3>Languages</h3>
            <div class="stack-grid">
              <div class="stack-item"><span class="label">Python</span><span class="meta">core</span></div>
              <div class="stack-item"><span class="label">C++</span><span class="meta">core</span></div>
              <div class="stack-item"><span class="label">JavaScript</span><span class="meta">scripting</span></div>
              <div class="stack-item"><span class="label">TypeScript</span><span class="meta">typed development</span></div>
            </div>
            <h3 style="margin-top:18px;">Web</h3>
            <div class="stack-grid">
              <div class="stack-item"><span class="label">React</span><span class="meta">UI development</span></div>
              <div class="stack-item"><span class="label">HTML</span><span class="meta">markup</span></div>

          `
        },
        projects: {
          title: 'projects',
          html: `
            <div class="proj">
              <div class="proj-head">
                <span class="proj-name">DigiSpeak &mdash; ASL translation glove</span>

            </div>
            <div class="proj">
              <div class="proj-head">
                <span class="proj-name">Generative ASCII engine</span>
                <span class="proj-tags">Canvas · JavaScript</span>
              </div>
              <div class="proj-desc">The interactive background of this very site &mdash; a cursor-reactive particle-grid renderer.</div>

            </div>
          `
        }
      };

      const overlay   = document.getElementById('overlay');
      const bracket   = document.getElementById('bracket-cursor');
      const panelEl   = document.querySelector('.panel');
      const panelBody = document.getElementById('panel-body');
      const panelHead = document.getElementById('panel-head');
      const panelTitle= document.getElementById('panel-title-text');
      const closeBtn  = document.getElementById('panel-close');
      const buttons   = document.querySelectorAll('.dock-btn');

      /* ---- DRAG ---- */
      let dragState = null;
      let currentPanelKey = null;
      const savedPositions = {}; // { about: {left, top}, stack: {...}, projects: {...} }

      function startDrag(e) {
        if (e.target.closest('.panel-close, #at-close')) return;
        bracket.classList.add('drag-mode');
        const point = e.touches ? e.touches[0] : e;
        const rect = panelEl.getBoundingClientRect();
        // Switch to absolute pixel positioning, dropping the CSS centering transform
        panelEl.style.left   = rect.left + 'px';
        panelEl.style.top    = rect.top  + 'px';
        panelEl.style.marginLeft = '0';
        panelEl.classList.add('is-dragging');
        dragState = { startX: point.clientX - rect.left, startY: point.clientY - rect.top };
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup',   stopDrag);
        document.addEventListener('touchmove', onDrag,   { passive: false });
        document.addEventListener('touchend',  stopDrag);
      }

      function onDrag(e) {
        if (!dragState) return;
        e.preventDefault();
        const point = e.touches ? e.touches[0] : e;
        let newLeft = point.clientX - dragState.startX;
        let newTop  = point.clientY - dragState.startY;
        // clamp so panel can't be dragged fully off screen
        newLeft = Math.max(0, Math.min(newLeft, window.innerWidth  - panelEl.offsetWidth));
        newTop  = Math.max(0, Math.min(newTop,  window.innerHeight - panelEl.offsetHeight));
        panelEl.style.left = newLeft + 'px';
        panelEl.style.top  = newTop  + 'px';
      }

      function stopDrag() {
        if (dragState && currentPanelKey) {
          savedPositions[currentPanelKey] = {
            left: panelEl.style.left,
            top: panelEl.style.top
          };
        }
        dragState = null;
        bracket.classList.remove('drag-mode');
        document.removeEventListener('mousemove', onDrag);
        document.removeEventListener('mouseup',   stopDrag);
        document.removeEventListener('touchmove', onDrag);
        document.removeEventListener('touchend',  stopDrag);
      }

      function resetPanelPosition() {
        panelEl.classList.remove('is-dragging');
        panelEl.style.left       = '';
        panelEl.style.top        = '';
        panelEl.style.marginLeft = '';
      }

      // stack/projects drag handle = panel-head
      panelHead.addEventListener('mousedown', startDrag);
      panelHead.addEventListener('touchstart', startDrag, { passive: false });
      panelHead.addEventListener('mousemove', (e) => {
        const overClose = e.target.closest('.panel-close');
        bracket.classList.toggle('drag-mode', !overClose);
      });
      panelHead.addEventListener('mouseleave', () => bracket.classList.remove('drag-mode'));

      /* ---- TERMINAL ---- */
      function initTerminal() {
        const tb      = document.getElementById('at-body');
        const ti      = document.getElementById('at-input');
        const atClose = document.getElementById('at-close');
        const atBar   = document.getElementById('at-titlebar');
        if (!tb || !ti || !atClose || !atBar) return;

        // about drag handle = terminal title bar
        atBar.addEventListener('mousedown', startDrag);
        atBar.addEventListener('touchstart', startDrag, { passive: false });
        atBar.addEventListener('mousemove', (e) => {
          const overClose = e.target.closest('#at-close');
          bracket.classList.toggle('drag-mode', !overClose);
        });
        atBar.addEventListener('mouseleave', () => bracket.classList.remove('drag-mode'));

        atClose.addEventListener('mouseenter', () => { atClose.style.background='#333'; atClose.style.color='#fff'; });
        atClose.addEventListener('mouseleave', () => { atClose.style.background='none'; atClose.style.color='#666'; });
        atClose.addEventListener('click', closePanel);

        const COMMANDS = {
          help: () => [
            ['bright', 'available commands:'],
            ['line',   '  whoami      — who is benjamin'],
            ['line',   '  edu         — education'],
            ['line',   '  clear       — clear terminal'],
          ],
          whoami: () => [
            ['bright', 'benjamin le'],
            ['accent', 'computer engineering @ texas a&m university'],
            ['', ''],
            ['line', 'full stack dev who likes the seams the most — the place where a'],
            ['line', 'frontend click turns into a database write, three services away.'],
            ['', ''],
            ['line', 'ships small. measures. iterates.'],
            ['line', 'reads the error before reading the docs.'],
            ['line', 'leaves the codebase a little clearer than he found it.'],
          ],
          edu: () => [
            ['bright', 'texas a&m university'],
            ['line',   'b.s. computer engineering'],
            ['line',   'college station, tx'],
          ],
          clear: () => '__CLEAR__',
        };

        const styles = { bright:'color:#f2f2f2', accent:'color:#bbb', err:'color:#aaa;font-style:italic', ok:'color:#ccc', dim:'color:#333', line:'color:#888' };

        function addLine(cls, text) {
          const d = document.createElement('div');
          d.style.cssText = (styles[cls] || styles.line) + ';white-space:pre-wrap;word-break:break-word;margin:0;font-family:IBM Plex Mono,Courier New,monospace;';
          d.textContent = text ?? '';
          tb.appendChild(d);
          tb.scrollTop = tb.scrollHeight;
        }

        function addEcho(cmd) {
          const d = document.createElement('div');
          d.style.margin = '0';
          d.innerHTML = '<span style="color:#f2f2f2">benjamin.le</span><span style="color:#444"> &gt; </span><span style="color:#888">about</span><span style="color:#444"> &gt; </span><span style="color:#ddd">' + cmd + '</span>';
          tb.appendChild(d);
        }

        addLine('bright', 'Welcome!');
        addLine('ok', "type 'help' to see available commands.");
        addLine('', '');

        ti.addEventListener('keydown', e => {
          if (e.key !== 'Enter') return;
          const raw = ti.value.trim().toLowerCase();
          ti.value = '';
          if (!raw) return;
          addEcho(raw);
          const fn = COMMANDS[raw];
          if (!fn) { addLine('err', "'" + raw + "' is not recognized. type 'help'."); addLine('', ''); return; }
          const result = fn();
          if (result === '__CLEAR__') { tb.innerHTML = ''; return; }
          result.forEach(([cls, text]) => addLine(cls, text));
          addLine('', '');
        });

        document.getElementById('about-terminal').addEventListener('click', () => ti.focus());
        ti.focus();
      }

      /* ---- OPEN / CLOSE ---- */
      function openPanel(key) {
        const data = content[key];
        if (!data) return;
        currentPanelKey = key;

        const saved = savedPositions[key];
        if (saved) {
          panelEl.classList.add('is-dragging'); // disable centering transform
          panelEl.style.left       = saved.left;
          panelEl.style.top        = saved.top;
          panelEl.style.marginLeft = '0';
        } else {
          resetPanelPosition();
        }

        if (data.isTerminal) {
          panelHead.classList.add('hidden');
          panelBody.classList.add('no-pad');
        } else {
          panelHead.classList.remove('hidden');
          panelBody.classList.remove('no-pad');
          panelTitle.textContent = data.title;
        }
        panelBody.innerHTML = data.html;
        overlay.classList.add('open');
        buttons.forEach(b => b.classList.toggle('active', b.dataset.panel === key));
        if (data.isTerminal) { initTerminal(); } else { closeBtn.focus(); }
      }

      function closePanel() {
        overlay.classList.remove('open');
        buttons.forEach(b => b.classList.remove('active'));
        stopDrag();
      }

      buttons.forEach(btn => btn.addEventListener('click', () => openPanel(btn.dataset.panel)));
      closeBtn.addEventListener('click', closePanel);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closePanel(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });

      /* ---- BRACKET CURSOR HOVER ---- */
      document.querySelectorAll('button, a').forEach(el => {
        el.addEventListener('mouseenter', () => bracket.classList.add('hover'));
        el.addEventListener('mouseleave', () => bracket.classList.remove('hover'));
      });

    })();
  </script>
