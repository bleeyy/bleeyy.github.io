<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Benjamin Le's Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>

    :root {
      --bg: #050505;
      --fg-dim: #3a3a3a;
      --fg-mid: #8a8a8a;
      --fg-bright: #f2f2f2;
      --accent: #ffffff;
      --accent-dim: #5a5a5a;
      --panel-bg: rgba(8, 8, 8, 0.88);
      --panel-border: rgba(255, 255, 255, 0.14);
      --font-body: 'IBM Plex Mono', 'Courier New', monospace;
    }

    * {
      box-sizing: border-box;
      cursor: none !important;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    #ascii-field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      cursor: none;
    }

    #cursor-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 340px;
      height: 340px;
      margin-left: -170px;
      margin-top: -170px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle,
          rgba(255, 255, 255, 0.12) 0%,
          rgba(255, 255, 255, 0.06) 28%,
          rgba(255, 255, 255, 0.0) 70%);
      transition: opacity 0.25s ease;
      opacity: 0;
      will-change: transform;
    }

    #bracket-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 70px;
      height: 30px;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transform: translate(-50%, -50%);
    }

    #bracket-cursor .left,
    #bracket-cursor .right {
      position: absolute;
      font-family: var(--font-body);
      font-size: 28px;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1;
    }

    #bracket-cursor .left {
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      border-right: none;
    }

    #bracket-cursor .right {
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      border-left: none;
    }

    .app {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: row;
      pointer-events: none;
    }

    .sidebar {
      pointer-events: none;
      position: relative;
      width: clamp(200px, 18vw, 260px);
      flex-shrink: 0;
      height: 100%;
      padding: clamp(18px, 3vw, 36px) 0 clamp(20px, 3vw, 34px) clamp(20px, 3vw, 40px);
    }

    .brand {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand .mark {
      font-size: clamp(15px, 1.8vw, 19px);
      letter-spacing: 0.04em;
      color: var(--fg-bright);
      font-weight: 600;
    }

    .brand .mark .blink {
      display: inline-block;
      width: 0.55ch;
      color: var(--accent);
      animation: blink 1.1s steps(1) infinite;
    }

    .brand .tagline {
      font-size: clamp(10px, 1vw, 12px);
      color: var(--fg-mid);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @keyframes blink {

      0%,
      49% {
        opacity: 1;
      }

      50%,
      100% {
        opacity: 0;
      }
    }

    .status {
      pointer-events: none;
      position: fixed;
      top: clamp(18px, 3vw, 36px);
      right: clamp(20px, 4vw, 48px);
      z-index: 3;
      font-size: clamp(10px, 1vw, 12px);
      color: var(--fg-mid);
      text-align: right;
      letter-spacing: 0.06em;
      line-height: 1.6;
      background: rgba(5, 5, 5, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 10px;
      border-radius: 3px;
      backdrop-filter: blur(4px);
    }

    .status .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--fg-bright);
      margin-right: 6px;
      box-shadow: 0 0 6px var(--fg-bright);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes shake {

      0%,
      100% {
        transform: translate(0, 0);
      }

      10% {
        transform: translate(-2px, 1px);
      }

      20% {
        transform: translate(1px, -2px);
      }

      30% {
        transform: translate(2px, 2px);
      }

      40% {
        transform: translate(-1px, -1px);
      }

      50% {
        transform: translate(2px, -2px);
      }

      60% {
        transform: translate(-2px, 2px);
      }

      70% {
        transform: translate(1px, 1px);
      }

      80% {
        transform: translate(-2px, -1px);
      }

      90% {
        transform: translate(1px, 2px);
      }
    }

    #status-text.active {
      color: #ff4444;
      animation: shake 0.3s ease-in-out infinite;
      display: inline-block;
    }

    main.stage {
      pointer-events: none;
      flex: 1;
      position: relative;
    }

    nav.dock {
      pointer-events: auto;
      position: absolute;
      top: 50%;
      left: clamp(20px, 3vw, 40px);
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
      width: calc(100% - clamp(20px, 3vw, 40px));
    }

    .dock-btn {
      appearance: none;
      border: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.075);
      color: var(--fg-mid);
      font-family: var(--font-body);
      font-size: clamp(15px, 1.8vw, 19px);
      font-weight: 400;
      letter-spacing: 0.05em;
      padding: 18px 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease;
    }

    .dock-btn .num {
      color: var(--fg-dim);
      font-size: 0.85em;
    }

    .dock-btn:hover {
      border-color: rgba(255, 255, 255, 0.45);
      color: var(--fg-bright);
      background: rgba(255, 255, 255, 0.07);
      transform: translateX(3px);
    }

    .dock-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .dock-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(255, 255, 255, 0.15);
      font-weight: 600;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
    }

    .dock-btn.active .num {
      color: var(--accent);
      font-weight: 700;
    }

    /* overlay panel */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: rgba(2, 4, 5, .55);
      opacity: 0;
      visibility: hidden;
      transition: opacity .22s ease;
    }

    #overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .panel {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) scale(0.985);
      opacity: 0;
      pointer-events: auto;
      width: calc(100% - 40px - 450px);
      max-width: 760px;
      max-height: min(1050px, calc(100vh - 104px));
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      transition: transform 0.22s ease, opacity 0.22s ease;
      overflow: hidden;
      margin-left: 225px;
    }

    #overlay.open .panel {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }

    .panel.is-dragging {
      transition: opacity 0.22s ease;
      transform: none !important;
    }

    /* panel-head: visible for stack/projects, hidden for about */
    .panel-head {
      cursor: move;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      border-bottom: 1px solid var(--panel-border);
      flex-shrink: 0;
    }

    .panel-head.hidden {
      display: none;
    }

    .panel-head .title {
      color: var(--fg-bright);
      font-size: 14px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel-head .title .idx {
      color: var(--accent);
    }

    .panel-close {
      appearance: none;
      background: none;
      border: 1px solid var(--panel-border);
      color: var(--fg-mid);
      width: 28px;
      height: 28px;
      border-radius: 3px;
      font-size: 14px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .panel-close:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .panel-body {
      padding: 22px;
      overflow-y: auto;
      color: var(--fg-mid);
      font-size: 13.5px;
      line-height: 1.65;
    }

    .panel-body.no-pad {
      padding: 0;
    }

    .panel-body::-webkit-scrollbar {
      width: 8px;
    }

    .panel-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .panel-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .panel-body h3 {
      color: var(--fg-bright);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 0 0 10px;
    }

    .panel-body p {
      margin: 0 0 14px;
    }

    .panel-body .muted {
      color: var(--fg-dim);
    }

    .stack-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 4px;
    }

    .stack-item {
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.02);
    }

    .stack-item .label {
      color: var(--fg-bright);
      font-size: 12.5px;
      display: block;
      margin-bottom: 3px;
    }

    .stack-item .meta {
      color: var(--fg-dim);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .proj {
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 14px 16px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.02);
    }

    .proj:last-child {
      margin-bottom: 0;
    }

    .proj .proj-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .proj .proj-name {
      color: var(--fg-bright);
      font-size: 14px;
      font-weight: 700;
    }

    .proj .proj-tags {
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .proj .proj-desc {
      margin-top: 6px;
      color: var(--fg-mid);
      font-size: 13px;
    }

    .proj a.proj-link {
      color: var(--fg-mid);
      font-size: 11.5px;
      text-decoration: none;
      border-bottom: 2px solid var(--fg-dim);
      display: inline-block;
      margin-top: 8px;
      position: relative;
      transition: color 0.2s ease, border-color 0.2s ease, text-shadow 0.2s ease;
    }

    .proj a.proj-link::after {
      content: ' →';
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .proj a.proj-link:hover {
      color: var(--accent);
      border-color: var(--accent);
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
    }

    .proj a.proj-link:hover::after {
      opacity: 1;
    }

    .social-row {
      pointer-events: auto;
      position: absolute;
      left: clamp(20px, 3vw, 40px);
      bottom: clamp(20px, 3vw, 36px);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .social-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      color: var(--fg-mid);
      transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease, transform 0.12s ease;
    }

    .social-icon:hover {
      color: var(--fg-bright);
      border-color: rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.07);
      transform: translateY(-2px);
    }

    .social-icon:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @keyframes termOpen {
      from {
        transform: scale(0.96);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Enhanced panel animations */
    @keyframes panelOpenSpring {
      0% {
        transform: translateX(-50%) scale(0.88);
        opacity: 0;
      }

      60% {
        transform: translateX(-50%) scale(1.02);
        opacity: 1;
      }

      100% {
        transform: translateX(-50%) scale(1);
        opacity: 1;
      }
    }

    #overlay.open .panel {
      animation: panelOpenSpring 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Staggered load animations */
    @keyframes slideInFromLeft {
      from {
        opacity: 0;
        transform: translateX(-8px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .brand {
      animation: slideInFromLeft 0.5s ease-out forwards;
    }

    .brand .tagline {
      animation: slideInFromLeft 0.6s ease-out forwards;
    }

    nav.dock .dock-btn:nth-child(1) {
      animation: slideInFromLeft 0.7s ease-out forwards;
    }

    nav.dock .dock-btn:nth-child(2) {
      animation: slideInFromLeft 0.8s ease-out forwards;
    }

    nav.dock .dock-btn:nth-child(3) {
      animation: slideInFromLeft 0.9s ease-out forwards;
    }

    .status {
      animation: slideInFromLeft 0.7s ease-out forwards;
      opacity: 0;
    }

    .social-row {
      animation: slideInFromLeft 1s ease-out forwards;
      opacity: 0;
    }

    /* Project link hover effects */
    .proj a.proj-link {
      position: relative;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .proj a.proj-link:hover {
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Dock button enhanced states */
    .dock-btn {
      position: relative;
      overflow: hidden;
    }

    .dock-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.05);
      transition: left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .dock-btn:hover::before {
      left: 100%;
    }

    /* Social icon animation */
    .social-icon {
      transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Bracket cursor enhanced scale */
    #bracket-cursor.hover {
      transform: scale(1.5) translate(-50%, -50%);
    }

    @media (max-width: 640px) {
      .app {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: auto;
        padding: 16px clamp(16px, 4vw, 28px) 14px;
      }

      .dock {
        position: relative;
        top: auto;
        left: auto;
        transform: none;
        margin-top: 18px;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 8px;
        width: 100%;
      }

      .dock-btn {
        width: auto;
        padding: 10px 14px;
        font-size: 13px;
      }

      .social-row {
        position: relative;
        left: auto;
        bottom: auto;
        margin-top: 18px;
      }

      #cursor-glow {
        display: none;
      }

      .panel {
        width: calc(100% - 20px);
        margin-left: 0;
        left: 10px;
        transform: none !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .brand .mark .blink {
        animation: none;
        opacity: 1;
      }

      .status .dot {
        animation: none;
      }
    }

    #bracket-cursor.hover {
      transform: scale(1.38) translate(-50%, -50%);
      transition: transform 0.12s ease, opacity 0.2s ease;
    }

    #bracket-cursor.hover .left,
    #bracket-cursor.hover .right {
      color: rgba(255, 255, 255, 0.85);
    }

    /* move-icon: hidden unless hovering a drag handle */
    #bracket-cursor .move-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      transition: opacity 0.12s ease, transform 0.12s ease;
      pointer-events: none;
    }

    #bracket-cursor.drag-mode .left,
    #bracket-cursor.drag-mode .right {
      opacity: 0;
    }

    #bracket-cursor.drag-mode .move-icon {
      opacity: 0.6;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>

<body>

  <canvas id="ascii-field"></canvas>
  <div id="cursor-glow"></div>
  <div id="bracket-cursor">
    <span class="left">[</span>
    <span class="right">]</span>
    <svg class="move-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="rgba(255,255,255,0.85)"
      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="5 9 2 12 5 15"></polyline>
      <polyline points="9 5 12 2 15 5"></polyline>
      <polyline points="15 19 12 22 9 19"></polyline>
      <polyline points="19 9 22 12 19 15"></polyline>
      <line x1="2" y1="12" x2="22" y2="12"></line>
      <line x1="12" y1="2" x2="12" y2="22"></line>
    </svg>
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark">benjamin.le<span class="blink">_</span></div>
        <div class="tagline">EMBEDDED SYSTEMS AND FPGA DESIGN</div>
      </div>

      <nav class="dock" aria-label="Site sections">
        <button class="dock-btn" data-panel="about">about</button>

      <div class="social-row" aria-label="Social links">
        <a class="social-icon" href="https://github.com/bleeyy" target="_blank" rel="noopener noreferrer"

          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"
            aria-hidden="true">

          </svg>

        <a class="social-icon" href="https://www.linkedin.com/in/benjamin-le-/" target="_blank"
          rel="noopener noreferrer" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path
              d="M4.98 3.5a2.5 2.5 0 1 1 0 5.001 2.5 2.5 0 0 1 0-5ZM2.98 9.99h4v12.51h-4V9.99Zm6.74 0h3.83v1.71h.05c.53-1 1.84-2.06 3.79-2.06 4.06 0 4.81 2.67 4.81 6.14v6.72h-4v-5.96c0-1.42-.03-3.25-1.98-3.25-1.98 0-2.29 1.55-2.29 3.15v6.06h-4V9.99Z" />
          </svg>
        </a>
      </div>
    </aside>

    <div class="status">
      <div><span class="dot"></span>field: <span id="status-text">stable</span></div>
    </div>

    <main class="stage"></main>
  </div>

  <div id="overlay">

        <div class="title"><span class="idx">//</span> <span id="panel-title-text"></span></div>
        <button class="panel-close" id="panel-close" aria-label="Close">✕</button>

  <script>
    (function () {
      const canvas = document.getElementById('ascii-field');
      const ctx = canvas.getContext('2d', { alpha: true });
      const bracket = document.getElementById('bracket-cursor');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const CHARSET_IDLE = "01.:-_+=*#%$<>/\\|{}[]()01";
      const CHARSET_AGITATED = "@#%&$*ZXKY01!?<>/\\^~";

      let cols, rows, cellW, cellH;
      let cells = [];
      let mouse = { x: -9999, y: -9999, active: false, vx: 0, vy: 0, lastX: -9999, lastY: -9999 };
      let ripples = [];
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      const FONT_SIZE = 17;
      const RADIUS = 170;
      const RADIUS2 = RADIUS * RADIUS;
      const MAX_RIPPLE_RADIUS = 180;
      const MAX_RIPPLE_RADIUS2 = MAX_RIPPLE_RADIUS * MAX_RIPPLE_RADIUS;
      const GRID_DENSITY = window.innerWidth < 768 ? 1.4 : 1.15;

      function rngChar(set) { return set[(Math.random() * set.length) | 0]; }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = window.innerWidth, h = window.innerHeight;
        canvas.width = Math.ceil(w * dpr);
        canvas.height = Math.ceil(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cellW = FONT_SIZE * 0.62 * GRID_DENSITY;
        cellH = FONT_SIZE * 1.05 * GRID_DENSITY;
        cols = Math.ceil(w / cellW) + 1;
        rows = Math.ceil(h / cellH) + 1;
        cells = [];

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if ((r + c) % 2 !== 0) continue;
            cells.push({
              x: c * cellW,
              y: r * cellH,
              ch: rngChar(CHARSET_IDLE),
              timer: Math.random() * 60,
              idleSpeed: 18 + Math.random() * 40,
              agitation: 0,
              baseAlpha: 0.18 + Math.random() * 0.22,
              phase: Math.random() * Math.PI * 2,
              jitterX: 0,
              jitterY: 0,
              pop: 0
            });
          }
        }
      }

      function onMove(e) {
        const x = e.clientX, y = e.clientY;
        mouse.vx = x - (mouse.lastX === -9999 ? x : mouse.lastX);
        mouse.vy = y - (mouse.lastY === -9999 ? y : mouse.lastY);
        mouse.lastX = x; mouse.lastY = y;
        mouse.x = x; mouse.y = y; mouse.active = true;
        bracket.style.opacity = '1';
        bracket.style.left = `${x}px`; bracket.style.top = `${y}px`;
      }

      function onLeave() { mouse.active = false; mouse.x = -9999; mouse.y = -9999; bracket.style.opacity = '0'; }

      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', onMove, { passive: true });
      window.addEventListener('mouseleave', onLeave);
      window.addEventListener('touchmove', (e) => { if (e.touches?.[0]) onMove(e.touches[0]); }, { passive: true });
      window.addEventListener('mousedown', (e) => {
        if (ripples.length > 3) ripples.shift();
        ripples.push({ x: e.clientX, y: e.clientY, r: 0, life: 0.8 });
      });
      window.addEventListener('touchend', onLeave);

      let frame = 0;
      let lastTick = 0;
      let overlayElement = null;

      function tick(timestamp) {
        if (document.hidden) {
          requestAnimationFrame(tick);
          return;
        }

        const panelOpen = overlayElement && overlayElement.classList.contains('open');
        const isActiveScene = mouse.active || ripples.length > 0 || panelOpen;
        const targetInterval = reducedMotion ? 1000 / 18 : (isActiveScene ? 1000 / 60 : 1000 / 14);

        if (!reducedMotion && timestamp - lastTick < targetInterval) {
          requestAnimationFrame(tick);
          return;
        }
        lastTick = timestamp;
        frame++;

        ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
        ctx.font = `${FONT_SIZE}px 'IBM Plex Mono', 'Courier New', monospace`;
        ctx.textBaseline = 'top';
        const mx = mouse.x, my = mouse.y;
        const idleStride = isActiveScene ? 1 : 3;

        if (!overlayElement) overlayElement = document.getElementById('overlay');

        for (let i = ripples.length - 1; i >= 0; i--) {
          const rp = ripples[i];
          rp.r += 1.5;
          rp.life *= 0.96;
          if (rp.life <= 0.02 || rp.r > MAX_RIPPLE_RADIUS) ripples.splice(i, 1);
        }

        const statusText = document.getElementById('status-text');
        if (statusText) {
          statusText.textContent = ripples.length > 0 ? 'active' : 'stable';
          statusText.classList.toggle('active', ripples.length > 0);
        }

        const speed = Math.min(Math.hypot(mouse.vx, mouse.vy), 40);
        mouse.vx *= 0.9; mouse.vy *= 0.9;

        for (let i = 0; i < cells.length; i++) {
          if ((i % idleStride) !== 0 && !isActiveScene) continue;

          const cell = cells[i];
          const cx = cell.x + cellW / 2;
          const cy = cell.y + cellH / 2;
          let target = 0;

          if (mouse.active) {
            const dx = cx - mx; const dy = cy - my;
            const d2 = dx * dx + dy * dy;
            if (d2 < RADIUS2) {
              const d = Math.sqrt(d2);
              const falloff = 1 - d / RADIUS;
              target = falloff * falloff * (0.55 + Math.min(speed / 40, 1) * 0.45);
            }
          }

          if (ripples.length > 0) {
            for (let j = 0; j < ripples.length; j++) {
              const rp = ripples[j];
              const dx = cx - rp.x;
              const dy = cy - rp.y;
              const distSq = dx * dx + dy * dy;
              if (distSq > MAX_RIPPLE_RADIUS2) continue;
              const dist = Math.sqrt(distSq);
              const wave = Math.abs(dist - rp.r);
              const influence = Math.max(0, 1 - wave / 10) * rp.life;
              if (influence > 0.15) {
                cell.agitation += influence * 0.8;
                cell.pop = Math.max(cell.pop, influence * 0.4);
              }
            }
          }

          if (target > cell.agitation) {
            cell.agitation += (target - cell.agitation) * 0.35;
          } else {
            cell.agitation += (target - cell.agitation) * 0.08;
          }

          const ag = cell.agitation;
          cell.pop *= 0.94;

          if (ag > 0.05) {
            if ((frame + (cell.phase * 10 | 0)) % 13 < 3) {
              cell.ch = rngChar(CHARSET_AGITATED);
            }
            const wave = Math.sin(frame * 0.12 + cell.phase);
            cell.jitterX = ((wave + 1) * 0.5 - 0.5) * ag * 4;
            cell.jitterY = ((Math.cos(frame * 0.14 + cell.phase * 1.3) + 1) * 0.5 - 0.5) * ag * 4;
          } else {
            cell.jitterX *= 0.8;
            cell.jitterY *= 0.8;
            cell.timer -= 1;
            if (cell.timer <= 0) {
              cell.ch = rngChar(CHARSET_IDLE);
              cell.timer = cell.idleSpeed + Math.random() * 20;
            }
          }

          const breathe = 0.5 + 0.5 * Math.sin(frame * 0.02 + cell.phase);
          const alpha = Math.max(0.05, Math.min(1, cell.baseAlpha * (0.6 + 0.4 * breathe) + ag * 0.9 + cell.pop * 0.8));
          let color;
          if (ag > 0.6) color = `rgba(255,255,255,${alpha})`;
          else if (ag > 0.15) color = `rgba(210,210,210,${alpha})`;
          else color = `rgba(120,120,120,${alpha})`;

          const size = FONT_SIZE * (1 + cell.pop * 0.8);
          ctx.font = `${size}px 'IBM Plex Mono', 'Courier New', monospace`;
          ctx.fillStyle = color;
          ctx.fillText(cell.ch, cell.x + cell.jitterX - (size - FONT_SIZE) / 2, cell.y + cell.jitterY - (size - FONT_SIZE) / 2);
        }

        requestAnimationFrame(tick);
      }

      window.triggerAsciiRipple = function (x, y, radius = 0, life = 0.9) {
        if (ripples.length > 5) ripples = ripples.slice(-5);
        ripples.push({ x, y, r: radius, life });
      };

      resize();
      requestAnimationFrame(tick);
    })();

      const overlay = document.getElementById('overlay');
      const bracket = document.getElementById('bracket-cursor');
      const panelEl = document.querySelector('.panel');
      const panelBody = document.getElementById('panel-body');
      const panelHead = document.getElementById('panel-head');
      const panelTitle = document.getElementById('panel-title-text');
      const closeBtn = document.getElementById('panel-close');
      const buttons = document.querySelectorAll('.dock-btn');

      /* ---- DRAG ---- */
      let dragState = null;
      let currentPanelKey = null;
      const savedPositions = {}; // { about: {left, top}, stack: {...}, projects: {...} }

      function startDrag(e) {
        // Don't drag when interacting with buttons, links, inputs, textareas, etc.
        if (
          e.target.closest(
            'button, a, input, textarea, select, .proj-link, .panel-close, #at-close'
          )
        ) {
          return;
        }

        bracket.classList.add('drag-mode');

        const point = e.touches ? e.touches[0] : e;
        const rect = panelEl.getBoundingClientRect();

        // Switch to absolute pixel positioning
        panelEl.style.left = rect.left + 'px';
        panelEl.style.top = rect.top + 'px';
        panelEl.style.marginLeft = '0';

        panelEl.classList.add('is-dragging');

        dragState = {
          startX: point.clientX - rect.left,
          startY: point.clientY - rect.top
        };

        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup', stopDrag);

        document.addEventListener('touchmove', onDrag, { passive: false });
        document.addEventListener('touchend', stopDrag);
      }

      function onDrag(e) {
        if (!dragState) return;
        e.preventDefault();
        const point = e.touches ? e.touches[0] : e;
        let newLeft = point.clientX - dragState.startX;
        let newTop = point.clientY - dragState.startY;
        // clamp so panel can't be dragged fully off screen
        newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - panelEl.offsetWidth));
        newTop = Math.max(0, Math.min(newTop, window.innerHeight - panelEl.offsetHeight));
        panelEl.style.left = newLeft + 'px';
        panelEl.style.top = newTop + 'px';
      }

      function stopDrag() {
        if (dragState && currentPanelKey) {
          savedPositions[currentPanelKey] = {
            left: panelEl.style.left,
            top: panelEl.style.top
          };
        }
        dragState = null;
        bracket.classList.remove('drag-mode');
        document.removeEventListener('mousemove', onDrag);
        document.removeEventListener('mouseup', stopDrag);
        document.removeEventListener('touchmove', onDrag);
        document.removeEventListener('touchend', stopDrag);
      }

      function resetPanelPosition() {
        panelEl.classList.remove('is-dragging');
        panelEl.style.left = '';
        panelEl.style.top = '';
        panelEl.style.marginLeft = '';
      }

      // Entire panel is draggable
      panelEl.addEventListener('mousedown', startDrag);
      panelEl.addEventListener('touchstart', startDrag, { passive: false });

      panelEl.addEventListener('mousemove', (e) => {
        const overInteractive = e.target.closest(
          'button, a, input, textarea, select'
        );

        bracket.classList.toggle('drag-mode', !overInteractive);
      });

      panelEl.addEventListener('mouseleave', () => {
        if (!dragState) {
          bracket.classList.remove('drag-mode');
        }
      });

      /* ---- TERMINAL ---- */
      function initTerminal() {
        const tb = document.getElementById('at-body');
        const ti = document.getElementById('at-input');
        const atClose = document.getElementById('at-close');
        const atBar = document.getElementById('at-titlebar');
        if (!tb || !ti || !atClose || !atBar) return;

        atClose.addEventListener('mouseenter', () => { atClose.style.background = '#333'; atClose.style.color = '#fff'; });
        atClose.addEventListener('mouseleave', () => { atClose.style.background = 'none'; atClose.style.color = '#666'; });
        atClose.addEventListener('click', closePanel);

        const COMMANDS = {
          help: () => [
            ['bright', 'available commands:'],
            ['line', '  whoami      — who is benjamin'],
            ['line', '  edu         — education'],
            ['line', '  clear       — clear terminal'],
          ],
          whoami: () => [
            ['bright', 'benjamin le'],
            ['accent', 'computer engineering @ texas a&m university'],
            ['', ''],
            ['line', 'embedded systems enthusiast with a passion for low-level design,'],
            ['line', 'real-time behavior, and turning hardware into purposeful tools.'],
            ['', ''],
            ['line', 'currently learning fpga design and development — interested in'],
            ['line', 'digital logic, hardware acceleration, and building systems that'],
            ['line', 'bridge software and silicon with intention.'],
          ],
          edu: () => [
            ['bright', 'texas a&m university'],
            ['line', 'b.s. computer engineering'],
            ['line', 'college station, tx'],
          ],
          clear: () => '__CLEAR__',
        };

        const styles = { bright: 'color:#f2f2f2', accent: 'color:#bbb', err: 'color:#aaa;font-style:italic', ok: 'color:#ccc', dim: 'color:#333', line: 'color:#888' };

        function addLine(cls, text) {
          const d = document.createElement('div');
          d.style.cssText = (styles[cls] || styles.line) + ';white-space:pre-wrap;word-break:break-word;margin:0;font-family:IBM Plex Mono,Courier New,monospace;';
          d.textContent = text ?? '';
          tb.appendChild(d);
          tb.scrollTop = tb.scrollHeight;
        }

        function addEcho(cmd) {
          const d = document.createElement('div');
          d.style.margin = '0';
          d.innerHTML = '<span style="color:#f2f2f2">benjamin.le</span><span style="color:#444"> &gt; </span><span style="color:#888">about</span><span style="color:#444"> &gt; </span><span style="color:#ddd">' + cmd + '</span>';
          tb.appendChild(d);
        }

        // Initial help text showing available commands
        addLine('dim', '┌─ terminal v1.0 ─────────────────────────────────');
        addLine('dim', '│');
        addLine('line', 'available commands:');
        addLine('line', '');
        addLine('bright', '  help');
        addLine('dim', '    show available commands');
        addLine('line', '');
        addLine('bright', '  whoami');
        addLine('dim', '    information about benjamin');
        addLine('line', '');
        addLine('bright', '  edu');
        addLine('dim', '    educational background');
        addLine('line', '');
        addLine('bright', '  clear');
        addLine('dim', '    clear terminal');
        addLine('dim', '│');
        addLine('dim', '└─────────────────────────────────────────────────');
        addLine('', '');

        ti.addEventListener('keydown', e => {
          if (e.key !== 'Enter') return;
          const raw = ti.value.trim().toLowerCase();
          ti.value = '';
          if (!raw) return;
          addEcho(raw);
          const fn = COMMANDS[raw];
          if (!fn) { addLine('err', "'" + raw + "' is not recognized. type 'help'."); addLine('', ''); return; }
          const result = fn();
          if (result === '__CLEAR__') { tb.innerHTML = ''; return; }
          result.forEach(([cls, text]) => addLine(cls, text));
          addLine('', '');
        });

        document.getElementById('about-terminal').addEventListener('click', () => ti.focus());
        ti.focus();
      }

      /* ---- OPEN / CLOSE ---- */
      function openPanel(key) {
        const data = content[key];
        if (!data) return;
        currentPanelKey = key;

        const saved = savedPositions[key];
        if (saved) {
          panelEl.classList.add('is-dragging'); // disable centering transform
          panelEl.style.left = saved.left;
          panelEl.style.top = saved.top;
          panelEl.style.marginLeft = '0';
        } else {
          resetPanelPosition();
        }

        if (data.isTerminal) {
          panelHead.classList.add('hidden');
          panelBody.classList.add('no-pad');
        } else {
          panelHead.classList.remove('hidden');
          panelBody.classList.remove('no-pad');
          panelTitle.textContent = data.title;
        }
        panelBody.innerHTML = data.html;
        overlay.classList.add('open');
        buttons.forEach(b => b.classList.toggle('active', b.dataset.panel === key));
        if (data.isTerminal) { initTerminal(); } else { closeBtn.focus(); }
      }

      function closePanel() {
        overlay.classList.remove('open');
        buttons.forEach(b => b.classList.remove('active'));
        stopDrag();
      }

      buttons.forEach(btn => btn.addEventListener('click', () => openPanel(btn.dataset.panel)));
      closeBtn.addEventListener('click', closePanel);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closePanel(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });

      /* ---- BRACKET CURSOR HOVER ---- */
      document.querySelectorAll('button, a').forEach(el => {
        el.addEventListener('mouseenter', () => bracket.classList.add('hover'));
        el.addEventListener('mouseleave', () => bracket.classList.remove('hover'));
      });

      /* ---- PROJECT LINK INTERACTIONS ---- */
      document.addEventListener('click', (e) => {
        const projLink = e.target.closest('.proj-link');
        if (projLink && projLink.href && !projLink.href.includes('javascript:')) {
          // Create ripple at click position
          if (window.triggerAsciiRipple) {
            window.triggerAsciiRipple(e.clientX, e.clientY, 0, 0.7);
          }
        }
      });

      /* ---- EMAIL COPY TO CLIPBOARD ---- */
      document.addEventListener('click', (e) => {
        if (e.target.closest('a[href^="mailto:"]')) {
          const email = 'benjaminle17@outlook.com';
          navigator.clipboard.writeText(email).then(() => {
            // Create visual feedback
            const emailEl = e.target.closest('a');
            const originalContent = emailEl.innerHTML;
            emailEl.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="20 6 9 17 4 12"/></svg>';
            emailEl.style.color = 'var(--accent)';
            setTimeout(() => {
              emailEl.innerHTML = originalContent;
              emailEl.style.color = '';
            }, 1500);
          });
        }
      });

      /* ---- KONAMI CODE EASTER EGG ---- */
      const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'KeyB', 'KeyA'];
      let konamiIndex = 0;

      document.addEventListener('keydown', (e) => {
        if (e.key === konamiCode[konamiIndex] || e.code === konamiCode[konamiIndex]) {
          konamiIndex++;
          if (konamiIndex === konamiCode.length) {
            konamiIndex = 0;
            activateKonamiEasterEgg();
          }
        } else {
          konamiIndex = 0;
        }
      });

      function activateKonamiEasterEgg() {
        // Trigger dramatic ASCII field effect
        if (window.triggerAsciiRipple) {
          const w = window.innerWidth, h = window.innerHeight;
          for (let i = 0; i < 5; i++) {
            setTimeout(() => {
              const x = Math.random() * w;
              const y = Math.random() * h;
              window.triggerAsciiRipple(x, y, 0, 0.85);
            }, i * 80);
          }
        }

        // Show hidden message
        const msg = document.createElement('div');
        msg.style.cssText = `
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background: rgba(5, 5, 5, 0.95);
          border: 1px solid rgba(255, 255, 255, 0.2);
          color: #f2f2f2;
          padding: 24px 32px;
          font-family: 'IBM Plex Mono', monospace;
          font-size: 14px;
          text-align: center;
          z-index: 9999;
          border-radius: 4px;
          pointer-events: auto;
          cursor: default;
          line-height: 1.6;
          animation: slideInFromLeft 0.4s ease-out;
        `;
        msg.innerHTML = '[ you found the secret ✓ ]<br><span style="font-size: 12px; color: #888;">nice moves, player one</span>';
        document.body.appendChild(msg);

        setTimeout(() => {
          msg.style.animation = 'slideInFromLeft 0.4s ease-out reverse';
          setTimeout(() => msg.remove(), 400);
        }, 2000);
      }

    })();
  </script>
